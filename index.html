<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Site name (browser tab + search results) -->
    <title>Skylar Wang — Product Designer &amp; Creative Technologist</title>
    <meta name="description" content="Skylar Wang designs systems people touch: financial tools, connected appliances, and interactive art." />

    <!-- Site icon (public/): browser tab, iOS home screen, Android/PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="theme-color" content="#e7e9ea" />

    <!-- Link-preview card (iMessage, LinkedIn, Slack, etc.). Static: this is a client-rendered
         SPA, so every route shares this preview. Image: public/og-image.png, 1200 x 630.
         After changing it, re-scrape on LinkedIn's Post Inspector to refresh their cache. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skylar Wang" />
    <meta property="og:title" content="Skylar Wang — Product Designer &amp; Creative Technologist" />
    <meta property="og:description" content="I design systems people touch: financial tools, connected appliances, and interactive art." />
    <meta property="og:image" content="https://www.skylarziyiwang.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Skylar Wang — Product Designer / Creative Technologist" />
    <meta property="og:url" content="https://www.skylarziyiwang.me/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.skylarziyiwang.me/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
