<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Name — Portfolio</title>
    <meta name="description" content="A short description of your work, shown by search engines." />

    <!-- Link-preview tags (iMessage, LinkedIn, Slack, etc.). These are static because
         this is a client-rendered SPA with no server, so every route shares this same
         preview — only the homepage link is guaranteed to show it correctly. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Name — Portfolio" />
    <meta property="og:description" content="A short description of your work, shown in link previews." />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
